server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${POSTGRES_USER:opspilot}
    password: ${POSTGRES_PASSWORD:opspilot-local-only}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-not-used}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
opspilot:
  ai:
    mode: ${AI_MODE:demo}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
  api-token: ${API_TOKEN:local-demo-token}
  lab:
    token: ${LAB_TOKEN:local-lab-token}
    fintech-url: ${FINTECH_LAB_URL:http://localhost:8081}
    healthcare-url: ${HEALTHCARE_LAB_URL:http://localhost:8082}
    commerce-url: ${COMMERCE_LAB_URL:http://localhost:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
